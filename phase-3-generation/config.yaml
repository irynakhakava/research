# Фаза 3 · RAG generation (/ask)

index_dir: data/processed/index
documents_path: data/processed/documents.jsonl
catalog_path: phase-0-discovery/sources.catalog.yaml
gold_set_path: phase-0-discovery/gold-set/dataset.jsonl
output_dir: data/processed

embeddings:
  backend: sentence_transformers
  model_name: intfloat/multilingual-e5-small
  batch_size: 16
  normalize: true
  passage_prefix: "passage: "
  query_prefix: "query: "

retrieve:
  mode: hybrid
  top_k: 5
  candidate_k: 20
  rrf_k: 60

generation:
  backend: extractive
  model_name: extractive
  max_context_chunks: 4
  min_dense_score: 0.28
  refuse_policy: refuse_with_nearest_links
  nearest_links: 3
  quote_chars: 280
  openai_base_url: https://api.openai.com/v1
  openai_model: gpt-4o-mini

eval:
  threshold_refuse_rate: 0.90
  threshold_citation_rate: 1.0
  threshold_grounded_rate: 0.80
  output_path: data/processed/ask_eval_report.json

server:
  host: 127.0.0.1
  port: 8080
